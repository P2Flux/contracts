# Foundry runs the fuzz and invariant suites under test/foundry/. The TypeScript suite (npm test)
# remains the deployment-facing suite; this one exists to push randomised inputs through the same
# contracts. Compiler settings mirror scripts/compile.ts so both suites exercise the same bytecode.
[profile.default]
src = "contracts"
test = "test/foundry"
out = "forge-out"
cache_path = "forge-cache"
libs = ["node_modules", "lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

# `FOUNDRY_PROFILE=deep forge test` - a longer soak for local use before a release.
[profile.deep.fuzz]
runs = 20000

[profile.deep.invariant]
runs = 512
depth = 128
